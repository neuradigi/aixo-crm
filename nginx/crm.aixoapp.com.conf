server {
    server_name crm.aixoapp.com;
    root /var/www/crm.aixoapp.com/app;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
server {
    if ($host = crm.aixoapp.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name crm.aixoapp.com;
    listen 80;
    return 404; # managed by Certbot
}


server {
    server_name crm-api.aixoapp.com;

    # Allow file/attachment uploads through the proxy (imports, barcodes, etc.).
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:30007;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_read_timeout 60;
        proxy_connect_timeout 60;
    }
}

